<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campionatul F1</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(18, 18, 24, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8f9fa;
            --text-muted: #8b949e;
            
           /*culori romania*/
            --ro-blue: #002B7F;
            --ro-yellow: #FCD116;
            --ro-red: #CE1126;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

       
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2;
            background: #050505;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.55;
            animation: floatOrb 22s infinite alternate ease-in-out;
        }

        .orb-1 { width: 600px; height: 600px; background: var(--ro-blue); top: -10%; left: -5%; }
        .orb-2 { width: 500px; height: 500px; background: var(--ro-yellow); top: 30%; left: 35%; animation-delay: -7s; opacity: 0.4; }
        .orb-3 { width: 550px; height: 550px; background: var(--ro-red); bottom: -10%; right: -5%; animation-delay: -14s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 80px) scale(1.15); }
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.04"/%3E%3C/svg%3E');
            z-index: -1;
            pointer-events: none;
        }

        .app-container {
            width: 100%;
            max-width: 1050px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-top: 3px solid transparent;
            background-clip: padding-box;
            border-radius: 24px;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: -1px; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--ro-blue) 0%, var(--ro-yellow) 50%, var(--ro-red) 100%);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #4da6ff 0%, #ffdf4d 50%, #ff4d4d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 28px;
            font-size: 1rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.1);
            border-color: var(--ro-yellow);
        }

        .tabs-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 12px 35px;
            border-radius: 50px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.08), inset 0 0 10px rgba(255,255,255,0.05);
        }

        .list-header {
            display: grid;
            grid-template-columns: 80px 1.5fr 1.5fr 150px;
            padding: 0 30px;
            color: var(--text-muted);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .list-header div:last-child {
            text-align: right;
            padding-right: 35px;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .driver-card {
            display: grid;
            grid-template-columns: 80px 1.5fr 1.5fr 150px;
            align-items: center;
            background: rgba(20, 20, 28, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .driver-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: var(--team-color);
            box-shadow: 0 0 15px var(--team-color);
            transition: width 0.3s ease;
        }

        .driver-card:hover {
            transform: translateX(8px) scale(1.01);
            background: rgba(30, 30, 40, 0.7);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: inset 150px 0 100px -100px var(--team-color),
                        0 15px 30px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .driver-card:hover::before {
            width: 8px;
        }

        .position {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.2);
        }

        .driver-card:nth-child(1) .position { color: #FFD700; text-shadow: 0 0 20px rgba(255,215,0,0.5); font-size: 2.2rem; }
        .driver-card:nth-child(2) .position { color: #C0C0C0; text-shadow: 0 0 20px rgba(192,192,192,0.5); font-size: 2rem; }
        .driver-card:nth-child(3) .position { color: #CD7F32; text-shadow: 0 0 20px rgba(205,127,50,0.5); font-size: 1.9rem; }

        .driver-name {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .team-pill {
            display: inline-flex;
            align-items: center;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .team-pill::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--team-color);
            margin-right: 10px;
            box-shadow: 0 0 8px var(--team-color);
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }

        .pts-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pts-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: scale(1.1);
        }

        .points-input {
            width: 75px;
            height: 42px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        .points-input:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: var(--team-color);
            box-shadow: 0 0 15px var(--team-color);
            transform: scale(1.05);
        }

        .points-input::-webkit-inner-spin-button,
        .points-input::-webkit-outer-spin-button {
            -webkit-appearance: none; margin: 0;
        }

        .team-score-display {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
            padding-right: 15px;
        }

    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="noise-overlay"></div>

    <div class="app-container">
        <header>
            <h1>Campionatul F1 - Ediția RO</h1>
            <button class="btn-reset" onclick="resetPoints()">Setări din Fabrică</button>
        </header>


        <div class="tabs-wrapper">
            <button id="tab-pilots" class="tab-btn active" onclick="switchTab('pilots')">Clasament Piloți</button>
            <button id="tab-teams" class="tab-btn" onclick="switchTab('teams')">Clasament Echipe</button>
        </div>

        <div class="list-header" id="list-header-container">

        </div>

        <div class="leaderboard-list" id="leaderboard-container">
        </div>
    </div>

    <script>
        const defaultDrivers = [
            { id: 1, name: "Dani", team: "McLaren", points: 310, color: "#FF8700" },
            { id: 2, name: "Andrei", team: "McLaren", points: 285, color: "#FF8700" },
            { id: 3, name: "Max Verstappen", team: "Red Bull", points: 270, color: "#3671C6" },
            { id: 4, name: "Alex", team: "Red Bull", points: 240, color: "#3671C6" },
            { id: 5, name: "Charles Leclerc", team: "Ferrari", points: 215, color: "#E80020" },
            { id: 6, name: "Lewis Hamilton", team: "Ferrari", points: 180, color: "#E80020" },
            { id: 7, name: "George Russell", team: "Mercedes", points: 155, color: "#27F4D2" },
            { id: 8, name: "Kimi Antonelli", team: "Mercedes", points: 90, color: "#27F4D2" },
            { id: 9, name: "Nico Hulkenberg", team: "Audi", points: 65, color: "#EE0000" },
            { id: 10, name: "Gabriel Bortoleto", team: "Audi", points: 40, color: "#EE0000" },
            { id: 11, name: "Sergio Perez", team: "Cadillac", points: 55, color: "#D4AF37" },
            { id: 12, name: "Valtteri Bottas", team: "Cadillac", points: 48, color: "#D4AF37" },
            { id: 13, name: "Fernando Alonso", team: "Aston Martin", points: 82, color: "#229971" },
            { id: 14, name: "Lance Stroll", team: "Aston Martin", points: 24, color: "#229971" },
            { id: 15, name: "Carlos Sainz", team: "Williams", points: 112, color: "#64C4FF" },
            { id: 16, name: "Alex Albon", team: "Williams", points: 38, color: "#64C4FF" },
            { id: 17, name: "Pierre Gasly", team: "Alpine", points: 18, color: "#0093CC" },
            { id: 18, name: "Franco Colapinto", team: "Alpine", points: 14, color: "#0093CC" },
            { id: 19, name: "Esteban Ocon", team: "Haas", points: 28, color: "#B6BABD" },
            { id: 20, name: "Oliver Bearman", team: "Haas", points: 12, color: "#B6BABD" },
            { id: 21, name: "Arvid Lindblad", team: "RB", points: 22, color: "#6692FF" },
            { id: 22, name: "Liam Lawson", team: "RB", points: 15, color: "#6692FF" }
        ];

        let drivers = JSON.parse(localStorage.getItem('f1_romanian_v8')) || [...defaultDrivers];
        let currentTab = 'pilots';

        function switchTab(tabName) {
            currentTab = tabName;
            
    
            document.getElementById('tab-pilots').classList.toggle('active', tabName === 'pilots');
            document.getElementById('tab-teams').classList.toggle('active', tabName === 'teams');
            
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const headerContainer = document.getElementById('list-header-container');
            const container = document.getElementById('leaderboard-container');
            container.innerHTML = '';

            if (currentTab === 'pilots') {
                headerContainer.innerHTML = `
                    <div>Loc</div>
                    <div>Pilot</div>
                    <div>Echipă</div>
                    <div>Puncte</div>
                `;

                drivers.sort((a, b) => b.points - a.points);

                drivers.forEach((driver, index) => {
                    const card = document.createElement('div');
                    card.className = 'driver-card';
                    card.style.animationDelay = `${index * 0.03}s`; 
                    card.style.setProperty('--team-color', driver.color);

                    card.innerHTML = `
                        <div class="position">${index + 1}</div>
                        <div class="driver-name">${driver.name}</div>
                        <div>
                            <span class="team-pill">${driver.team}</span>
                        </div>
                        <div class="controls-wrapper">
                            <button class="pts-btn" onclick="changePoints(${driver.id}, -1)">-</button>
                            <input type="number" class="points-input" value="${driver.points}" onchange="updatePoints(${driver.id}, this.value)">
                            <button class="pts-btn" onclick="changePoints(${driver.id}, 1)">+</button>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } else {
                headerContainer.innerHTML = `
                    <div>Loc</div>
                    <div>Echipă</div>
                    <div>Componență Piloți</div>
                    <div>Total Puncte</div>
                `;

                const teamsData = {};
                drivers.forEach(d => {
                    if (!teamsData[d.team]) {
                        teamsData[d.team] = { 
                            name: d.team, 
                            points: 0, 
                            color: d.color, 
                            driverNames: [] 
                        };
                    }
                    teamsData[d.team].points += d.points;
                    teamsData[d.team].driverNames.push(d.name);
                });

                const teamsArray = Object.values(teamsData).sort((a, b) => b.points - a.points);

                teamsArray.forEach((team, index) => {
                    const card = document.createElement('div');
                    card.className = 'driver-card';
                    card.style.animationDelay = `${index * 0.03}s`; 
                    card.style.setProperty('--team-color', team.color);

                    card.innerHTML = `
                        <div class="position">${index + 1}</div>
                        <div class="driver-name" style="font-size: 1.5rem; letter-spacing: 1px;">
                            ${team.name}
                        </div>
                        <div>
                            <span style="font-size: 0.9rem; color: var(--text-muted); font-weight: 500;">
                                ${team.driverNames.join(' & ')}
                            </span>
                        </div>
                        <div class="controls-wrapper">
                            <div class="team-score-display">${team.points} <span style="font-size: 1rem; color: var(--text-muted);">PTS</span></div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            localStorage.setItem('f1_romanian_v8', JSON.stringify(drivers));
        }

        function updatePoints(id, value) {
            let newPoints = parseInt(value);
            if (isNaN(newPoints) || newPoints < 0) newPoints = 0;
            
            const driver = drivers.find(d => d.id === id);
            if (driver) {
                driver.points = newPoints;
                renderLeaderboard();
            }
        }

        function changePoints(id, amount) {
            const driver = drivers.find(d => d.id === id);
            if (driver) {
                driver.points = Math.max(0, driver.points + amount);
                renderLeaderboard();
            }
        }

        function resetPoints() {
            if (confirm("Ești sigur că vrei să dai reset? Ștergem tot și o luăm de la capăt.")) {
                drivers = [...defaultDrivers].map(d => ({...d}));
                renderLeaderboard();
            }
        }

        renderLeaderboard();
    </script>
</body>
</html>
